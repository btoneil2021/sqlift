name: Supabase Keepalive

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    env:
      KEEPALIVE_URL: https://cs-5200-project.vercel.app/api/supabase/keepalive
    steps:
      - name: Ping Supabase-backed health route
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "Missing KEEPALIVE_URL."
            exit 1
          fi

          response="$(
          curl --fail --silent --show-error --location \
            --retry 10 \
            --retry-delay 30 \
            --retry-all-errors \
            "$KEEPALIVE_URL"
          )"
          echo "$response"
          echo "$response" | grep -Eq '"status":[[:space:]]*"ok"'
