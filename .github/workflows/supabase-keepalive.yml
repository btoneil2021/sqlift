name: Supabase Keepalive

on:
  schedule:
    - cron: "17 14 * * 1,4"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    env:
      KEEPALIVE_URL: https://cs-5200-project.vercel.app/api/supabase/keepalive
    steps:
      - name: Ping Supabase-backed health route
        run: |
          response="$(curl --fail --silent --show-error --location "$KEEPALIVE_URL")"
          echo "$response"
          echo "$response" | grep -Eq '"status":[[:space:]]*"ok"'
